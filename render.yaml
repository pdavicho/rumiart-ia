services:
  - type: web
    name: rumiart-ia-backend
    env: python
    rootDir: backend
    pythonVersion: 3.11.0
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # ← se configura manualmente en el dashboard de Render
